[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
anyhow = "1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
lopdf = "0.45"
png = "0.18"
serde_json = "1"
skrifa = "0.44"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"
# Reads .github workflow files as YAML for `cargo xtask pins` (BUILD-003, R2); pure safe Rust, no build script.
yaml-rust2 = { version = "0.13", default-features = false }

# Peak memory of a measured child process (BUILD-002). A maintained safe wrapper over the Win32
# process APIs; the workspace forbids unsafe code, so nothing in xtask calls them directly.
[target.'cfg(windows)'.dependencies]
win32job = "2"
