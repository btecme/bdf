# Divergences from the independent reader that are understood and accepted for now.
#
# `cargo xtask bdf-oracle --strict` fails on any case whose verdict is not an accepted one unless an entry
# here names that case and that exact verdict, with a reason. An entry whose case now has an accepted
# verdict, or a different one, is stale and fails the gate, so this list cannot drift from the results.
# Each reason points at the triage in docs/bdf-evidence/BUILD-002.md. The entries are not a statement
# that the behaviour is correct; the renderer adaptations they refer to (G1 to G3) are separate work.
#
# Each entry is tied (`tracks`) to an open defect (G1 image sampling, G2 widget fallback, G3 page-tree
# repair, F10 admission limits) or to a documented rendering difference (G6 thin-line policy,
# oracle-artefact, reader-defined, stroke-placement), and the list is temporary: fixing a defect removes
# its entries. A visual entry also carries the `baseline` metrics of every page comparison as reviewed.
# The verdict of a failing case can stay the same while its output gets worse, so the gate fails when a
# baselined metric grows past its margin. The remedy is to look at the images, decide whether the change
# is acceptable, and only then re-baseline (`bdf-oracle --print-baselines`) with the reason in the commit.

