# cargo-deny policy (M0.4). Run with `cargo xtask deny`; part of `cargo xtask ci`.
# Code dependencies follow the same rule as assets (AGENTS.md): permissive licences only.
# Copyleft (GPL, AGPL, LGPL) is never linked; such tools run only as external oracle processes.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Shared UI components; Cargo.toml pins the immutable revision.
allow-git = ["https://github.com/storytold/craft-libs"]

[advisories]
yanked = "warn"
ignore = [
    # Marvin (RSA private-key timing side channel, no fixed `rsa` release). pdfcraft-sign uses
    # `rsa` only for public-key signature verification, which the advisory does not affect; RSA
    # private-key operations use aws-lc-rs on native targets and are refused in the browser
    # (ADR-0009). Revisit when a fixed `rsa` ships.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for verification only (ADR-0009)" },

    # zvariant, zbus_names and zvariant_derive (RUSTSEC-2026-0370, -0371, -0372, published 2026-10-16): the three
    # crates were folded into zbus 6 and stopped being maintained on their own. These are informational
    # "unmaintained" notices: no vulnerability, no patched version, the remedy is a move to zbus 6. They reach the
    # build on Linux only, through zbus 5.19 (used by pdfcraft-platform's portal theme watcher) and through
    # egui's accessibility stack (accesskit_unix, atspi), which the project does not control; the Windows app does
    # not link them. One entry per crate, so a different crate or a real vulnerability in these still fails the
    # check. Revisit when accesskit_unix and atspi move to zbus 6, then move pdfcraft-platform with them and delete
    # all three entries.
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (merged into zbus 6); Linux accessibility and portal code only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (merged into zbus 6); Linux accessibility and portal code only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (merged into zbus 6); Linux accessibility and portal code only" },
]

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font): font licences on the AGENTS.md
# §1.2 allowlist, attributed in ATTRIBUTION.toml as dependency-bundled assets.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
