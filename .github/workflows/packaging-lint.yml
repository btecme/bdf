# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pinned to a reviewed commit of the reusable workflow (BUILD-003, finding F07); it was tracked at @main.
    # The pin does not reach the `uses:` lines inside that workflow, several of which still name
    # craft-common-actions/actions/*@main: see docs/bdf-evidence/BUILD-003.md. To update, review the new
    # commit (and what it calls) and change the SHA; `cargo xtask pins` rejects any floating reference here.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@43f4e83c68764f9d880f8a6c10328bc550465f2b # main on 2026-10-16
