# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Pinned to a reviewed commit of the reusable workflow (BUILD-003, finding F07); it was tracked at @main.
    # The pin does not reach the `uses:` lines inside that workflow, several of which still name
    # craft-common-actions/actions/*@main: see docs/bdf-evidence/BUILD-003.md. To update, review the new
    # commit (and what it calls) and change the SHA; `cargo xtask pins` rejects any floating reference here.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@43f4e83c68764f9d880f8a6c10328bc550465f2b # main on 2026-10-16
    with:
      craft-fonts-ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
