# Windows qualification of the portable updates and the Local System deployment (BUILD-018). It publishes nothing and signs nothing.
#
# The flows that need a disposable Windows machine run on GitHub-hosted runners, which are thrown away after every job:
#   * probe      which ways of acting as another person work from Local System (exact errors), to choose the mechanism;
#   * system     deploy as Local System (as Action1 does) to real standard-user profiles, a second user, the Default profile, an account
#                that may not run batch tasks, a run ended part-way;
#   * boundary   the file-system race against a real second process running as the person (previous script measured, current asserted);
#   * disk       a really full volume (a 640 MB virtual disk) for the download, the update and the deployment script;
#   * desktop    the real window (Later, download, a cancelled close, the unsaved-work question, the update, the restart, the data) on
#                Windows Server, and the Windows integration on Windows Server and on Windows 11 (ARM64): register, the default-app
#                choice driven through Settings, a PDF double-click, as far as they can be driven without a person.
# The programs under test are built here with a throwaway signing key made in the build job (never uploaded: only the public key and
# the signed packages are). They trust only that key, only in the dev channel, and only read a feed from a loopback address.
# qualify-windows.ps1 refuses to run anywhere that is not a disposable machine, so it cannot be run by accident on a person's PC.
# Every `uses:` below is pinned to a full commit SHA (`cargo xtask pins`).
name: Windows qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/qualify-windows.yml
      - packaging/windows/deploy-bdf.ps1
      - packaging/windows/qualify-*.ps1
      - packaging/windows/test-deploy*.ps1
      - packaging/windows/test-updater-interrupt.ps1
      - packaging/windows/test-update-gui.ps1
      - packaging/windows/preview-feed.ps1
      - packaging/windows/.qualify-reuse-run
      - crates/update/**
      - apps/pdfcraft-updater/**
      - crates/ui-egui/src/updates.rs

concurrency:
  group: qualify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    name: which ways of acting as another person work from Local System
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe
        shell: pwsh
        run: ./packaging/windows/qualify-windows.ps1 -Stage probe -EvidenceDir "$env:GITHUB_WORKSPACE\qualify-evidence" -ThisMachineIsDisposable
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-ChildItem qualify-evidence -Filter *.txt | ForEach-Object { "``````"; Get-Content $_.FullName; "``````" } | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-probe
          path: qualify-evidence/**
          retention-days: 14
  build:
    name: build the throwaway-signed programs and run the tests that need the key
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # While the stage scripts are being worked on, the programs do not change. If packaging/windows/.qualify-reuse-run holds the id of an
      # earlier run of this workflow, its build material is taken from that run instead of being rebuilt (the build and the tests that need
      # the key are then skipped, not passed). Empty or absent, everything is built and run, which is what a release qualification needs.
      - name: Reuse the build material of an earlier run, if asked
        id: reuse
        shell: pwsh
        run: |
          $f = 'packaging/windows/.qualify-reuse-run'
          $id = if (Test-Path $f) { (Get-Content $f -Raw).Trim() } else { '' }
          if ($id -match '^[0-9]+$') {
            "reuse=true" | Add-Content $env:GITHUB_OUTPUT
            "run_id=$id" | Add-Content $env:GITHUB_OUTPUT
            Write-Output "::notice title=Build reused::The programs and packages are those built by run $id; nothing was rebuilt and the build-job tests did not run."
          } else {
            "reuse=false" | Add-Content $env:GITHUB_OUTPUT
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.reuse.outputs.reuse == 'true'
        with:
          name: qualify-material
          path: ${{ runner.temp }}/qual
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Check out craft-fonts
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Point the build at craft-fonts
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: |
          "CRAFT_FONTS_DIR=$env:GITHUB_WORKSPACE\craft-fonts" | Add-Content -Path $env:GITHUB_ENV
          "CRAFT_FONTS_REQUIRED=1" | Add-Content -Path $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.reuse.outputs.reuse != 'true'
        with:
          toolchain: 1.99.0 # keep in step with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.reuse.outputs.reuse != 'true'
        with:
          key: qualify-windows
      - name: Build two versions with a throwaway key, package and sign them
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: ./packaging/windows/qualify-build.ps1 -Out "$env:RUNNER_TEMP\qual" -KeyFile "$env:RUNNER_TEMP\private\dev.key"
      - name: Deployment script tests (all of them, as the current user)
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: ./packaging/windows/test-deploy.ps1
      - name: Deployment script killed part-way, at a swept series of moments
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: ./packaging/windows/test-deploy-interrupt.ps1 -Rounds 12
      - name: The real updater killed part-way, at a swept series of moments
        if: steps.reuse.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $v0 = (Get-Content "$env:RUNNER_TEMP\qual\versions.txt")[0]
          $app = "$env:RUNNER_TEMP\interrupt-app"
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory("$env:RUNNER_TEMP\qual\packages\$v0\bdf-$v0-windows-x64-portable.zip", "$env:RUNNER_TEMP\interrupt-x")
          Get-ChildItem (Get-ChildItem "$env:RUNNER_TEMP\interrupt-x" -Directory | Select-Object -First 1).FullName -Force | Move-Item -Destination $app
          ./packaging/windows/test-updater-interrupt.ps1 -BdfDir $app -KeyFile "$env:RUNNER_TEMP\private\dev.key" -Rounds 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualify-material
          path: ${{ runner.temp }}/qual/**
          if-no-files-found: error
          retention-days: 3

  system:
    name: Local System deployment to real profiles
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualify-material
          path: ${{ runner.temp }}/qual
      - name: Qualify
        shell: pwsh
        run: ./packaging/windows/qualify-windows.ps1 -Stage system -Material "$env:RUNNER_TEMP\qual" -EvidenceDir "$env:GITHUB_WORKSPACE\qualify-evidence" -ThisMachineIsDisposable
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-ChildItem qualify-evidence -Filter *.txt | ForEach-Object { "``````"; Get-Content $_.FullName; "``````" } | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-system
          path: qualify-evidence/**
          retention-days: 14

  boundary:
    name: file-system race against a real second process
    needs: build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0 # keep in step with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: qualify-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualify-material
          path: ${{ runner.temp }}/qual
      - name: The previous in-place script, from the commit before the user-step rework
        shell: pwsh
        run: |
          git show 1a9a4d3f:packaging/windows/deploy-bdf.ps1 | Set-Content -Path "$env:RUNNER_TEMP\deploy-bdf-previous.ps1" -Encoding utf8
          Get-Item "$env:RUNNER_TEMP\deploy-bdf-previous.ps1" | Select-Object Name, Length
      - name: Qualify
        shell: pwsh
        run: ./packaging/windows/qualify-windows.ps1 -Stage boundary -Material "$env:RUNNER_TEMP\qual" -EvidenceDir "$env:GITHUB_WORKSPACE\qualify-evidence" -LegacyDeploy "$env:RUNNER_TEMP\deploy-bdf-previous.ps1" -ThisMachineIsDisposable
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-ChildItem qualify-evidence -Filter *.txt | ForEach-Object { "``````"; Get-Content $_.FullName; "``````" } | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-boundary
          path: qualify-evidence/**
          retention-days: 14

  disk:
    name: a really full volume
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualify-material
          path: ${{ runner.temp }}/qual
      - name: Qualify
        shell: pwsh
        run: ./packaging/windows/qualify-windows.ps1 -Stage disk -Material "$env:RUNNER_TEMP\qual" -EvidenceDir "$env:GITHUB_WORKSPACE\qualify-evidence" -ThisMachineIsDisposable
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-ChildItem qualify-evidence -Filter *.txt | ForEach-Object { "``````"; Get-Content $_.FullName; "``````" } | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-disk
          path: qualify-evidence/**
          retention-days: 14

  desktop:
    name: the real window and Windows integration (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualify-material
          path: ${{ runner.temp }}/qual
      - name: Qualify
        shell: pwsh
        run: ./packaging/windows/qualify-windows.ps1 -Stage desktop -Material "$env:RUNNER_TEMP\qual" -EvidenceDir "$env:GITHUB_WORKSPACE\qualify-evidence" -ThisMachineIsDisposable
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-ChildItem qualify-evidence -Filter *.txt | ForEach-Object { "``````"; Get-Content $_.FullName; "``````" } | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualify-desktop-${{ matrix.os }}
          path: qualify-evidence/**
          retention-days: 14
