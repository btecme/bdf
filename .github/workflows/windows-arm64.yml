# Windows on ARM (#61): package the ARM64 release the way release.yml does (cross-compiled on an
# x64 runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner and run it, and
# run the test suite natively on ARM64.
name: Windows ARM64

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "41 4 * * 1" # weekly, so drift in the runner images shows up
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Pinned to a reviewed commit of the reusable workflow (BUILD-003, finding F07); it was tracked at @main.
    # The pin does not reach the `uses:` lines inside that workflow, several of which still name
    # craft-common-actions/actions/*@main: see docs/bdf-evidence/BUILD-003.md. To update, review the new
    # commit (and what it calls) and change the SHA; `cargo xtask pins` rejects any floating reference here.
    # That workflow installs `stable` plus the ARM64 target, but cargo then runs the compiler pinned in
    # rust-toolchain.toml, which lacked the target (E0463 on the first hosted run). It has no input to choose
    # a toolchain, so packaging/windows/package.ps1 adds the target to the compiler in use (BUILD-001).
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@43f4e83c68764f9d880f8a6c10328bc550465f2b # main on 2026-10-16
    with:
      app-name: pdfcraft
      app-dir: PdfCraft
