[package]
name = "pdfcraft-app-service"
description = "The application service behind every PdfCraft surface: typed operations over privately owned document sessions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-engine = { workspace = true }
pdfcraft-platform = { workspace = true }
# Grant and audit files (JSON), the grant secrets' hashes and the audit chain; all already in the tree.
serde_json = { workspace = true }
sha2 = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Grant secrets and identifiers.
getrandom = "0.4"

[dev-dependencies]
tempfile = "3.27"
