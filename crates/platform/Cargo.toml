[package]
name = "pdfcraft-platform"
description = "Operating-system services shared by the PdfCraft desktop app and automation tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]

[target.'cfg(windows)'.dependencies]
# `ReplaceFile`, which keeps the replaced file's permissions (a rename gives the new file the folder's
# inherited ones); safe bindings, already in the tree through pdfcraft-ui-egui and pdfcraft.
# The current user's SID, for the private-file check (`advapi`).
winsafe = { version = "0.0.29", default-features = false, features = ["kernel", "advapi"] }

[target.'cfg(unix)'.dependencies]
# A plain fsync where a volume refuses the full flush `sync_all` asks for (macOS: SMB, FUSE), and the effective user
# id for the private-file check; already in the tree.
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency graph through the accessibility integration. The portal watcher
# uses the async API so dropping it can cancel an idle subscription without polling.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# Exercise the actual portal wire decoder and cancellable worker on every native test host.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"
