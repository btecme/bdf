[package]
name = "pdfcraft-automation"
description = "Agent control for BDF: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-engine = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-render = { workspace = true }
pdfcraft-organize = { workspace = true }
pdfcraft-platform = { workspace = true }
# The grant-gated MCP server (client_mcp) is an adapter over the service (BUILD-009); the tools and the service must also
# agree (tests/service_parity.rs).
pdfcraft-app-service = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
png = "0.18"
base64 = { version = "0.22", optional = true }

# The software tools (BUILD-018): updates need the HTTPS transport; the browser build has no updater.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pdfcraft-update = { workspace = true, features = ["net"] }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
# Test signing key, packages and installed-copy fixtures for the software tools' tests (never in a product build).
pdfcraft-update = { workspace = true, features = ["net", "testing"] }
pdfcraft-fonts = { workspace = true }
flate2.workspace = true
pdfcraft-model = { workspace = true }
pdfcraft-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
